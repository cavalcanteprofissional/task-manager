# ---------------------------------------------------------------------------
# secret.yaml
# Credenciais sensíveis (equivalente ao .env.local). Usa stringData (texto
# puro que o k8s codifica em base64 ao gravar no etcd). Apenas para fins
# didáticos locais — não deve ser usado com valores reais em produção.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: task-manager-secret
  namespace: task-manager
  labels:
    app: task-manager
type: Opaque
stringData:
  # Credenciais do PostgreSQL (usadas tanto pelo Deployment do banco quanto pelo app)
  DATABASE_USER: "admin"
  DATABASE_PASSWORD: "admin"
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "admin"
  POSTGRES_DB: "task_manager"
